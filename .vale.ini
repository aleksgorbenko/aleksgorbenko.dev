StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Site

[*.md]
BasedOnStyles = Site
TokenIgnores = (\{\{<[^>]*>\}\}), (\[\[[^\]]+\]\]), (!\[[^\]]*\]\([^)]*\)), (\]\([^)]*\)), (\b(color-scheme|theme-color)\b), (symbol = "[a-z0-9.]+")

[layouts/**/*.html]
BasedOnStyles = Site
TokenIgnores = (\{\{[^}]*\}\})
