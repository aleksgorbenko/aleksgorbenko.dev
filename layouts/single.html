{{ define "main" }}
  <article class="container container-prose">
    <header class="page-header">
      <h1 class="page-title">{{ .Title }}</h1>
      {{ if eq .Type "blog" }}
        <p class="page-meta">
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
        </p>
      {{ end }}
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
    {{ if eq .Type "blog" }}
      <nav class="post-nav" aria-label="More posts">
        {{ with .NextInSection }}<a class="post-nav-previous" href="{{ .RelPermalink }}">← {{ .Title }}</a>{{ end }}
        {{ with .PrevInSection }}<a class="post-nav-next" href="{{ .RelPermalink }}">{{ .Title }} →</a>{{ end }}
      </nav>
    {{ end }}
  </article>
{{ end }}
